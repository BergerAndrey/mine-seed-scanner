<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed Scanner</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <main class="app">
        <section class="game-select">
            <label class="game-label" for="gameSelect">Game</label>
            <select id="gameSelect" class="game-picker">
                <option value="mines">Mines</option>
                <option value="dice">Dice</option>
                <option value="keno">Keno</option>
            </select>
        </section>

        <section class="scanner-card">
            <aside class="controls-panel">
                <div class="field-wrap">
                    <label for="clientSeed">Client Seed <span>*</span></label>
                    <input id="clientSeed" class="text-input" type="text" placeholder="Enter client seed...">
                </div>

                <div class="field-wrap">
                    <label for="serverSeed">Server Seed (Unhashed) <span>*</span></label>
                    <input id="serverSeed" class="text-input" type="text" placeholder="Enter server seed...">
                </div>

                <div class="field-row">
                    <div class="field-wrap">
                        <label for="startNonce">Nonce Start</label>
                        <input id="startNonce" class="text-input" type="number" value="0" min="0">
                    </div>
                    <div class="field-wrap">
                        <label for="endNonce">Nonce End</label>
                        <input id="endNonce" class="text-input" type="number" value="10000" min="1">
                    </div>
                </div>

                <details class="advanced">
                    <summary>Advanced Settings</summary>
                    <div class="field-row advanced-row">
                        <div class="field-wrap">
                            <label for="minHitInput">Min Hit</label>
                            <input id="minHitInput" class="text-input" type="number" value="1" min="1">
                        </div>
                        <div class="field-wrap">
                            <label for="maxRowsInput">Max Rows</label>
                            <input id="maxRowsInput" class="text-input" type="number" value="250" min="1">
                        </div>
                    </div>
                </details>

                <button id="startBtn" class="primary-btn" type="button" disabled>Analyze Seeds</button>
                <button id="stopBtn" class="secondary-btn" type="button" disabled>Stop</button>

                <div class="progress-wrap" id="progressWrap">
                    <div class="progress-bar" id="progressBar">0%</div>
                </div>

                <section class="patterns-panel" id="patternsPanel">
                    <h2>Saved Patterns</h2>
                    <div class="pattern-save-row">
                        <input id="patternName" class="text-input" type="text" placeholder="Pattern name">
                        <button id="savePatternBtn" class="small-btn" type="button">Save</button>
                    </div>
                    <div id="patternsList" class="patterns-list"></div>
                </section>
            </aside>

            <section class="game-panel">
                <div class="mode-panel" data-mode="mines">
                    <div class="slider-head">
                        <strong>Mines: <span id="mineCountLabel">3</span></strong>
                    </div>
                    <input id="mineCount" class="range-input" type="range" value="3" min="1" max="24">
                    <div class="board-status">
                        <span id="minesStats">Gems: 0 / Mines: 3</span>
                        <span id="minesMultiplier">-</span>
                    </div>
                    <p class="hint" id="minesHint">Select tiles to click (0/22)</p>
                    <div id="minesGrid" class="tile-grid mines-grid"></div>
                </div>

                <div class="mode-panel hidden" data-mode="dice">
                    <div class="segmented" role="group" aria-label="Dice type">
                        <button id="diceOverBtn" class="segment-btn active" type="button" data-dice-type="over">Over</button>
                        <button id="diceUnderBtn" class="segment-btn" type="button" data-dice-type="under">Under</button>
                    </div>
                    <div class="dice-value">Value: <strong id="diceValueLabel">50.00</strong></div>
                    <input id="diceValue" class="range-input" type="range" value="50" min="1" max="99" step="0.01">
                    <div class="dice-card">
                        <div>
                            <span>Multiplier</span>
                            <strong id="diceMultiplier">1.98x</strong>
                        </div>
                        <div>
                            <span>Win Chance</span>
                            <strong id="diceChance">50.00%</strong>
                        </div>
                    </div>
                </div>

                <div class="mode-panel hidden" data-mode="keno">
                    <div class="risk-row">
                        <strong>Risk Level</strong>
                        <div class="segmented">
                            <button class="segment-btn active" type="button" data-risk="classic">Classic</button>
                            <button class="segment-btn" type="button" data-risk="low">Low</button>
                            <button class="segment-btn" type="button" data-risk="medium">Medium</button>
                            <button class="segment-btn" type="button" data-risk="high">High</button>
                        </div>
                    </div>
                    <p class="hint" id="kenoHint">Select 1-10 numbers to analyze (0 selected)</p>
                    <div id="kenoGrid" class="tile-grid keno-grid"></div>
                </div>
            </section>
        </section>

        <section class="results-card">
            <div class="results-head">
                <h2>Parsed Results</h2>
                <span>Found: <strong id="perfectCount">0</strong></span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Nonce</th>
                            <th>Max Hit</th>
                            <th>Payout Counts</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </section>
    </main>

<script>
const WORKER_SOURCE = `
const encoder = new TextEncoder();
const keyCache = new Map();

async function getHmacKey(serverSeed) {
    if (keyCache.has(serverSeed)) return keyCache.get(serverSeed);
    const key = await crypto.subtle.importKey('raw', encoder.encode(serverSeed), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    keyCache.set(serverSeed, key);
    return key;
}

async function hmacBytes(serverSeed, message) {
    const key = await getHmacKey(serverSeed);
    return new Uint8Array(await crypto.subtle.sign('HMAC', key, encoder.encode(message)));
}

function formatHmacMessage(clientSeed, nonce, round) {
    return clientSeed + ':' + nonce + ':' + round;
}

async function randomBytes(serverSeed, clientSeed, nonce, byteCount) {
    let bytes = new Uint8Array(0);
    let round = 0;
    while (bytes.length < byteCount) {
        const digest = await hmacBytes(serverSeed, formatHmacMessage(clientSeed, nonce, round));
        const merged = new Uint8Array(bytes.length + digest.length);
        merged.set(bytes, 0);
        merged.set(digest, bytes.length);
        bytes = merged;
        round++;
    }
    return bytes;
}

function uint32ToFloat(bytes, offset) {
    const value = bytes[offset] * 16777216 + bytes[offset + 1] * 65536 + bytes[offset + 2] * 256 + bytes[offset + 3];
    return value / 4294967296;
}

async function drawUnique(serverSeed, clientSeed, nonce, count, poolSize) {
    const pool = Array.from({ length: poolSize }, (_, i) => i);
    const bytes = await randomBytes(serverSeed, clientSeed, nonce, count * 4);
    const result = [];
    for (let i = 0; i < count; i++) {
        const value = uint32ToFloat(bytes, i * 4);
        const idx = Math.floor(value * pool.length);
        result.push(pool.splice(idx, 1)[0]);
    }
    return result;
}

function combinations(n, k) {
    if (k < 0 || k > n) return 0;
    if (k === 0 || k === n) return 1;
    let c = 1;
    for (let i = 1; i <= k; i++) c = c * (n - i + 1) / i;
    return c;
}

function minesMultiplier(hits, mines) {
    if (hits < 1 || mines < 1 || hits + mines > 25) return null;
    if (hits === 1 && mines === 1) return 1.01;
    const win = combinations(25 - mines, hits);
    if (!win) return null;
    const value = 0.99 * (combinations(25, hits) / win);
    return value >= 1000 ? Math.round(value) : Math.round(value * 100) / 100;
}

function diceMultiplier(type, target) {
    const chance = type === 'under' ? target : 100 - target;
    if (chance <= 0) return null;
    return Math.round((99 / chance) * 10000) / 10000;
}

function formatPayout(value) {
    if (value === null || Number.isNaN(value)) return '-';
    return 'x' + Number(value).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 }).replace(/,/g, ' ');
}

async function analyzeNonce(data, nonce) {
    if (data.game === 'mines') {
        const mines = await drawUnique(data.serverSeed, data.clientSeed, nonce, data.mineCount, 25);
        const mineSet = new Set(mines);
        let hits = 0;
        for (const pos of data.selected) {
            if (mineSet.has(pos)) break;
            hits++;
        }
        if (hits < data.minHit) return null;
        const payout = minesMultiplier(hits, data.mineCount);
        return { nonce, maxHit: hits, payoutCounts: formatPayout(payout) };
    }

    if (data.game === 'keno') {
        const drawn = await drawUnique(data.serverSeed, data.clientSeed, nonce, 10, 40);
        const finalDraw = drawn.map(n => n + 1);
        const drawnSet = new Set(finalDraw);
        const hits = data.selected.filter(n => drawnSet.has(n)).length;
        if (hits < data.minHit) return null;
        return { nonce, maxHit: hits, payoutCounts: hits + ' / ' + data.selected.length + ' hits | ' + finalDraw.join(', ') };
    }

    const bytes = await randomBytes(data.serverSeed, data.clientSeed, nonce, 4);
    const roll = Math.floor(uint32ToFloat(bytes, 0) * 10000) / 100;
    const isWin = data.diceType === 'under' ? roll < data.diceValue : roll > data.diceValue;
    if (!isWin) return null;
    const payout = diceMultiplier(data.diceType, data.diceValue);
    return { nonce, maxHit: roll.toFixed(2), payoutCounts: formatPayout(payout) };
}

self.onmessage = async function (event) {
    const data = event.data;
    const total = data.endNonce - data.startNonce + 1;
    let processed = 0;
    for (let nonce = data.startNonce; nonce <= data.endNonce; nonce++) {
        const result = await analyzeNonce(data, nonce);
        if (result) self.postMessage({ found: true, result });
        processed++;
        if (processed % 250 === 0 || processed === total) {
            self.postMessage({ progress: (processed / total * 100).toFixed(1) });
        }
    }
    self.postMessage({ done: true });
};
`;

const WORKER_URL = URL.createObjectURL(new Blob([WORKER_SOURCE], { type: 'application/javascript' }));
const state = {
    game: 'mines',
    diceType: 'over',
    kenoRisk: 'classic',
    minesSelected: [],
    kenoSelected: [],
    stopper: null
};

const el = {
    gameSelect: document.getElementById('gameSelect'),
    clientSeed: document.getElementById('clientSeed'),
    serverSeed: document.getElementById('serverSeed'),
    startNonce: document.getElementById('startNonce'),
    endNonce: document.getElementById('endNonce'),
    minHit: document.getElementById('minHitInput'),
    maxRows: document.getElementById('maxRowsInput'),
    startBtn: document.getElementById('startBtn'),
    stopBtn: document.getElementById('stopBtn'),
    progressWrap: document.getElementById('progressWrap'),
    progressBar: document.getElementById('progressBar'),
    resultsBody: document.getElementById('resultsBody'),
    perfectCount: document.getElementById('perfectCount'),
    mineCount: document.getElementById('mineCount'),
    mineCountLabel: document.getElementById('mineCountLabel'),
    minesStats: document.getElementById('minesStats'),
    minesHint: document.getElementById('minesHint'),
    minesMultiplier: document.getElementById('minesMultiplier'),
    minesGrid: document.getElementById('minesGrid'),
    diceValue: document.getElementById('diceValue'),
    diceValueLabel: document.getElementById('diceValueLabel'),
    diceMultiplier: document.getElementById('diceMultiplier'),
    diceChance: document.getElementById('diceChance'),
    kenoGrid: document.getElementById('kenoGrid'),
    kenoHint: document.getElementById('kenoHint'),
    patternName: document.getElementById('patternName'),
    savePatternBtn: document.getElementById('savePatternBtn'),
    patternsList: document.getElementById('patternsList')
};

let patterns = [];

document.addEventListener('DOMContentLoaded', () => {
    buildMinesGrid();
    buildKenoGrid();
    bindEvents();
    loadPatterns();
    updateGameMode();
    updateControls();
});

function bindEvents() {
    el.gameSelect.addEventListener('change', () => {
        state.game = el.gameSelect.value;
        updateGameMode();
        updateControls();
    });
    [el.clientSeed, el.serverSeed, el.startNonce, el.endNonce, el.minHit].forEach(input => {
        input.addEventListener('input', updateControls);
    });
    el.mineCount.addEventListener('input', () => {
        trimMinesSelection();
        updateControls();
    });
    el.diceValue.addEventListener('input', updateDiceInfo);
    document.querySelectorAll('[data-dice-type]').forEach(btn => {
        btn.addEventListener('click', () => {
            state.diceType = btn.dataset.diceType;
            document.querySelectorAll('[data-dice-type]').forEach(item => item.classList.toggle('active', item === btn));
            updateDiceInfo();
        });
    });
    document.querySelectorAll('[data-risk]').forEach(btn => {
        btn.addEventListener('click', () => {
            state.kenoRisk = btn.dataset.risk;
            document.querySelectorAll('[data-risk]').forEach(item => item.classList.toggle('active', item === btn));
        });
    });
    el.startBtn.addEventListener('click', startScan);
    el.stopBtn.addEventListener('click', stopScan);
    el.savePatternBtn.addEventListener('click', savePattern);
}

function buildMinesGrid() {
    el.minesGrid.innerHTML = '';
    for (let i = 0; i < 25; i++) {
        const button = document.createElement('button');
        button.className = 'tile';
        button.type = 'button';
        button.dataset.pos = i;
        button.addEventListener('click', () => toggleMinesTile(i));
        el.minesGrid.appendChild(button);
    }
}

function buildKenoGrid() {
    el.kenoGrid.innerHTML = '';
    for (let i = 1; i <= 40; i++) {
        const button = document.createElement('button');
        button.className = 'tile numbered';
        button.type = 'button';
        button.textContent = i;
        button.dataset.number = i;
        button.addEventListener('click', () => toggleKenoNumber(i));
        el.kenoGrid.appendChild(button);
    }
}

function toggleMinesTile(pos) {
    const mineCount = parseInt(el.mineCount.value, 10);
    const maxGems = 25 - mineCount;
    if (state.minesSelected.includes(pos)) {
        state.minesSelected = state.minesSelected.filter(item => item !== pos);
    } else if (state.minesSelected.length < maxGems) {
        state.minesSelected.push(pos);
    }
    updateControls();
}

function toggleKenoNumber(number) {
    if (state.kenoSelected.includes(number)) {
        state.kenoSelected = state.kenoSelected.filter(item => item !== number);
    } else if (state.kenoSelected.length < 10) {
        state.kenoSelected.push(number);
    }
    updateControls();
}

function trimMinesSelection() {
    const mineCount = parseInt(el.mineCount.value, 10);
    const maxGems = 25 - mineCount;
    state.minesSelected = state.minesSelected.slice(0, maxGems);
}

function updateGameMode() {
    document.querySelectorAll('.mode-panel').forEach(panel => {
        panel.classList.toggle('hidden', panel.dataset.mode !== state.game);
    });
}

function updateControls() {
    updateMinesInfo();
    updateKenoInfo();
    updateDiceInfo();
    renderPatternsList();
    const hasSeeds = el.clientSeed.value.trim() && el.serverSeed.value.trim();
    const rangeOk = getStartNonce() <= getEndNonce();
    const selectionOk =
        state.game === 'dice' ||
        (state.game === 'mines' && state.minesSelected.length > 0) ||
        (state.game === 'keno' && state.kenoSelected.length > 0);
    el.startBtn.disabled = !(hasSeeds && rangeOk && selectionOk);
}

function updateMinesInfo() {
    const mineCount = parseInt(el.mineCount.value, 10);
    const maxGems = 25 - mineCount;
    el.mineCountLabel.textContent = mineCount;
    el.minesStats.textContent = 'Gems: ' + state.minesSelected.length + ' / Mines: ' + mineCount;
    el.minesHint.textContent = 'Select tiles to click (' + state.minesSelected.length + '/' + maxGems + ')';
    el.minesMultiplier.textContent = formatMultiplier(minesMultiplier(state.minesSelected.length, mineCount));
    document.querySelectorAll('#minesGrid .tile').forEach(tile => {
        const pos = parseInt(tile.dataset.pos, 10);
        tile.classList.toggle('selected', state.minesSelected.includes(pos));
        tile.classList.toggle('disabled', !state.minesSelected.includes(pos) && state.minesSelected.length >= maxGems);
        tile.innerHTML = state.minesSelected.includes(pos) ? '<img class="gem-icon" src="./gem.png" alt="gem">' : '';
    });
}

function updateKenoInfo() {
    el.kenoHint.textContent = 'Select 1-10 numbers to analyze (' + state.kenoSelected.length + ' selected)';
    document.querySelectorAll('#kenoGrid .tile').forEach(tile => {
        const number = parseInt(tile.dataset.number, 10);
        tile.classList.toggle('selected', state.kenoSelected.includes(number));
        tile.classList.toggle('disabled', !state.kenoSelected.includes(number) && state.kenoSelected.length >= 10);
    });
}

function updateDiceInfo() {
    const value = parseFloat(el.diceValue.value);
    const chance = state.diceType === 'under' ? value : 100 - value;
    const multiplier = chance > 0 ? 99 / chance : 0;
    el.diceValueLabel.textContent = value.toFixed(2);
    el.diceChance.textContent = chance.toFixed(2) + '%';
    el.diceMultiplier.textContent = multiplier.toFixed(4) + 'x';
}

function getStartNonce() {
    return parseInt(el.startNonce.value, 10) || 0;
}

function getEndNonce() {
    return parseInt(el.endNonce.value, 10) || 0;
}

function combinations(n, k) {
    if (k < 0 || k > n) return 0;
    if (k === 0 || k === n) return 1;
    let c = 1;
    for (let i = 1; i <= k; i++) c = c * (n - i + 1) / i;
    return c;
}

function minesMultiplier(gems, mines) {
    if (gems < 1 || mines < 1 || gems + mines > 25) return null;
    if (gems === 1 && mines === 1) return 1.01;
    const win = combinations(25 - mines, gems);
    if (!win) return null;
    const value = 0.99 * (combinations(25, gems) / win);
    return value >= 1000 ? Math.round(value) : Math.round(value * 100) / 100;
}

function formatMultiplier(value) {
    if (value === null || Number.isNaN(value)) return '-';
    return 'x' + Number(value).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace(/,/g, ' ');
}

function startScan() {
    stopScan(false);
    el.resultsBody.innerHTML = '';
    el.perfectCount.textContent = '0';
    setProgress(0);
    el.startBtn.disabled = true;
    el.stopBtn.disabled = false;

    const params = {
        game: state.game,
        serverSeed: el.serverSeed.value.trim(),
        clientSeed: el.clientSeed.value.trim(),
        startNonce: getStartNonce(),
        endNonce: getEndNonce(),
        minHit: parseInt(el.minHit.value, 10) || 1,
        mineCount: parseInt(el.mineCount.value, 10),
        selected: state.game === 'keno' ? [...state.kenoSelected] : [...state.minesSelected],
        diceType: state.diceType,
        diceValue: parseFloat(el.diceValue.value)
    };

    state.stopper = runScanWithWorkers(
        params,
        addResult,
        setProgress,
        () => {
            setProgress(100);
            el.stopBtn.disabled = true;
            state.stopper = null;
            updateControls();
        }
    );
}

function stopScan(update = true) {
    if (state.stopper) {
        state.stopper();
        state.stopper = null;
    }
    el.stopBtn.disabled = true;
    if (update) updateControls();
}

function runScanWithWorkers(params, onResult, onProgress, onDone) {
    const totalRange = params.endNonce - params.startNonce + 1;
    if (totalRange <= 0) {
        onDone();
        return () => {};
    }
    const workerCount = Math.min(Math.max((navigator.hardwareConcurrency || 4) - 1, 1), totalRange);
    const chunkSize = Math.ceil(totalRange / workerCount);
    const workers = [];
    const progress = new Array(workerCount).fill(0);
    let completed = 0;

    for (let i = 0; i < workerCount; i++) {
        const start = params.startNonce + i * chunkSize;
        const end = Math.min(params.endNonce, start + chunkSize - 1);
        if (start > end) continue;
        const worker = new Worker(WORKER_URL);
        workers.push(worker);
        const share = (end - start + 1) / totalRange;
        worker.onmessage = event => {
            if (event.data.found) onResult(event.data.result);
            if (event.data.progress !== undefined) {
                progress[i] = (parseFloat(event.data.progress) / 100) * share;
                onProgress(progress.reduce((sum, item) => sum + item, 0) * 100);
            }
            if (event.data.done) {
                progress[i] = share;
                completed++;
                if (completed === workers.length) onDone();
            }
        };
        worker.postMessage({ ...params, startNonce: start, endNonce: end });
    }

    return () => workers.forEach(worker => worker.terminate());
}

function setProgress(value) {
    const percent = Math.max(0, Math.min(100, Number(value))).toFixed(1);
    el.progressBar.style.width = percent + '%';
    el.progressBar.textContent = percent + '%';
}

function addResult(result) {
    const maxRows = parseInt(el.maxRows.value, 10) || 250;
    const rows = Array.from(el.resultsBody.rows);
    let insertAt = rows.length;
    for (let i = 0; i < rows.length; i++) {
        if (result.nonce < parseInt(rows[i].cells[0].textContent, 10)) {
            insertAt = i;
            break;
        }
    }
    const row = el.resultsBody.insertRow(insertAt);
    row.innerHTML = '<td>' + result.nonce + '</td><td>' + result.maxHit + '</td><td>' + result.payoutCounts + '</td>';
    while (el.resultsBody.rows.length > maxRows) el.resultsBody.deleteRow(el.resultsBody.rows.length - 1);
    el.perfectCount.textContent = String((parseInt(el.perfectCount.textContent, 10) || 0) + 1);
}

function currentPatternPositions() {
    if (state.game === 'mines') return [...state.minesSelected];
    if (state.game === 'keno') return [...state.kenoSelected];
    return [];
}

function loadPatterns() {
    const saved = localStorage.getItem('seedScannerPatterns');
    if (!saved) return;
    try {
        patterns = JSON.parse(saved);
    } catch {
        patterns = [];
    }
}

function persistPatterns() {
    localStorage.setItem('seedScannerPatterns', JSON.stringify(patterns));
}

function savePattern() {
    if (state.game === 'dice') {
        alert('Dice does not use saved tile patterns.');
        return;
    }
    const name = el.patternName.value.trim();
    const positions = currentPatternPositions();
    if (!name) {
        alert('Enter pattern name.');
        return;
    }
    if (positions.length === 0) {
        alert('Select tiles or numbers first.');
        return;
    }
    patterns = patterns.filter(pattern => !(pattern.game === state.game && pattern.name === name));
    patterns.push({ id: Date.now(), game: state.game, name, positions });
    persistPatterns();
    el.patternName.value = '';
    renderPatternsList();
}

function renderPatternsList() {
    const list = patterns.filter(pattern => pattern.game === state.game);
    if (state.game === 'dice') {
        el.patternsList.innerHTML = '<p class="empty-state">Dice has no tile patterns.</p>';
        return;
    }
    if (!list.length) {
        el.patternsList.innerHTML = '<p class="empty-state">No saved patterns.</p>';
        return;
    }
    el.patternsList.innerHTML = list.map(pattern => (
        '<div class="pattern-item">' +
        '<span>' + pattern.name + ' (' + pattern.positions.length + ')</span>' +
        '<div class="pattern-actions">' +
        '<button type="button" onclick="loadPattern(' + pattern.id + ')">Load</button>' +
        '<button type="button" onclick="deletePattern(' + pattern.id + ')">Delete</button>' +
        '</div>' +
        '</div>'
    )).join('');
}

window.loadPattern = function(id) {
    const pattern = patterns.find(item => item.id === id);
    if (!pattern) return;
    if (pattern.game === 'mines') state.minesSelected = [...pattern.positions];
    if (pattern.game === 'keno') state.kenoSelected = [...pattern.positions];
    updateControls();
};

window.deletePattern = function(id) {
    patterns = patterns.filter(pattern => pattern.id !== id);
    persistPatterns();
    renderPatternsList();
